# Included by market-agri-infra (Anexo G). No `ports`: only the API Gateway publishes one.
# PostgreSQL and workflow_app are owned by infra; workflow-db-migrate is the deliberate migration
# runner of the workflow schema (ADR-013) and the service never migrates.
services:
  workflow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
    expose:
      - "8080"
    healthcheck:                      # liveness for now; readiness with the database joins later (D-C20)
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    # Longer than the 20 s graceful shutdown declared in application.yml.
    stop_grace_period: 25s
    restart: unless-stopped
    networks: [platform]

  workflow-db-migrate:
    image: liquibase/liquibase:4.29
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../db:/workspace:ro
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changelog-file=changelog/changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE}
      - --username=${PG_ADMIN_USER:?set PG_ADMIN_USER}
      - --password=${PG_ADMIN_PASSWORD:?set PG_ADMIN_PASSWORD}
      - --database-changelog-table-name=databasechangelog_workflow
      - --database-changelog-lock-table-name=databasechangeloglock_workflow
    command: [update]
    networks: [platform]

networks:
  platform:
    name: platform-${ENV:?set ENV}
    external: true
