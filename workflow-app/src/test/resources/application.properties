# Unit and HTTP tests run without a database: the pool points to an address nobody listens on,
# so readiness reports the database DOWN. The integration tests replace the URL (WorkflowPersistenceIT).
spring.datasource.url=jdbc:postgresql://localhost:1/unreachable
spring.datasource.username=workflow_app
spring.datasource.password=unused
# The issuer of auth (ADR-020) for the Spring tests; the public key comes from
# WorkflowSpringTest, generated per run. Without it the composition root does not start.
jwt.issuer=market-agri-auth
# The participants of the saga: nobody listens on port 1, so a test that reaches one by mistake gets
# no answer; the HTTP tests replace the ports with @Primary ones. The token is a placeholder.
participants.chat-api-url=http://localhost:1
participants.catalog-api-url=http://localhost:1
participants.transactions-api-url=http://localhost:1
participants.service-token=test-service-token
