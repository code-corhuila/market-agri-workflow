name: CI

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test all modules
        run: mvn -B -ntp verify

  # Only on promotion to qa (git-conventions §6): PostgreSQL with the workflow schema of db/.
  integration:
    if: github.base_ref == 'qa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test database with the workflow schema
        run: bash scripts/test-database.sh >> "$GITHUB_ENV"
      - name: Unit, HTTP and integration tests
        run: mvn -B -ntp verify -Pintegration
